# Builds the NROs and hands out the SD card layout. No game file is part of this.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Repository check
        run: python3 tools/check_repo.py

      - name: Libraries
        # The image has what the build needs. The package server sometimes turns CI machines
        # away, and a build that goes on with the image's packages is better than none.
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed switch-dev switch-cmake deko3d uam switch-mesa switch-libjpeg-turbo switch-zlib && exit 0
            sleep 30
          done
          echo "::warning::the package server did not answer: building with the image's packages"

      - name: Build
        run: ./build.sh

      - name: Check the NROs
        run: |
          python3 tools/check_nro.py SD_CARD/switch/RtCWNX/RtCWNX.nro "Return to Castle Wolfenstein" hazevauks
          python3 tools/check_nro.py SD_CARD/switch/RtCWNX/mp/RtCWNX_MP.nro "Return to Castle Wolfenstein Multiplayer" hazevauks

      - name: Check the package for game files
        run: |
          if find SD_CARD -type f | grep -viE '/README\.md$|\.nro$'; then
            echo "SD_CARD holds something besides the NROs"
            exit 1
          fi

      # What a player copies to the SD card's root.
      - uses: actions/upload-artifact@v4
        with:
          name: RtCWNX_sd
          path: SD_CARD/
          if-no-files-found: error

      # What it takes to read a crash report of this build.
      - uses: actions/upload-artifact@v4
        with:
          name: RtCWNX_elf
          path: build/*.elf
          if-no-files-found: error

      - name: Package for a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd SD_CARD
          apt-get install -y -qq zip
          zip -r ../RtCWNX.zip switch

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RtCWNX.zip
          draft: true

  # The same game on OpenGL through Mesa: it tells a problem of the platform from one of the native renderer.
  fallback:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build python3

      - name: Libraries
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed switch-dev switch-cmake switch-mesa switch-libdrm_nouveau switch-libjpeg-turbo switch-zlib && exit 0
            sleep 30
          done
          echo "::warning::the package server did not answer: building with the image's packages"

      - name: Build
        run: ./build.sh -DRTCW_RENDERER_BACKEND=opengl

      - uses: actions/upload-artifact@v4
        with:
          name: RtCWNX_fallback_opengl
          path: SD_CARD/
          if-no-files-found: error
